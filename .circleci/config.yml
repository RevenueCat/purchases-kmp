aliases:
  # Matches the same tags as release-tags-job, but without lookaheads,
  # which are unsupported in `when: matches:` conditions:
  # https://circleci.com/changelog/breaking-change-regex-engine-update-for-config-compilation/
  release-tags-workflow: &release-tags-workflow
    when:
      and:
        - matches: { pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+.*$", value: << pipeline.git.tag >> }
        - not:
            matches: { pattern: ".*-SNAPSHOT.*", value: << pipeline.git.tag >> }
        - not:
            equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
  release-tags-job: &release-tags-job
    filters:
      tags:
        only: /^[0-9]+\.[0-9]+\.[0-9]+.*$/
        ignore: /^.*-SNAPSHOT/
      branches:
        ignore: /.*/

version: 2.1

orbs:
  android: circleci/android@2.5.0
  revenuecat: revenuecat/sdks-common-config@4.6.2

commands:
  run-sdk-update-test-cases:
    parameters:
      platform:
        type: enum
        enum: [ios, android]
    steps:
      - run:
          name: Build SDK update test apps
          command: MAESTRO_TEST_STORE_API_KEY="$WORKFLOWS_TEST_STORE_API_KEY" bundle exec fastlane build_sdk_update_test_apps platform:<< parameters.platform >>
          no_output_timeout: 20m
      - run:
          name: Run SDK update test (anonymous_user)
          command: bundle exec fastlane run_sdk_update_test platform:<< parameters.platform >> test_case:anonymous_user
          no_output_timeout: 15m
      - run:
          name: Run SDK update test (logged_in_user)
          command: bundle exec fastlane run_sdk_update_test platform:<< parameters.platform >> test_case:logged_in_user
          no_output_timeout: 15m
          when: always
      - store_test_results:
          path: fastlane/test_output/sdk_update_tests/<< parameters.platform >>/anonymous_user/junit
      - store_test_results:
          path: fastlane/test_output/sdk_update_tests/<< parameters.platform >>/logged_in_user/junit
      - store_artifacts:
          path: fastlane/test_output/sdk_update_tests/<< parameters.platform >>
      - store_artifacts:
          path: build/sdk_update_tests/<< parameters.platform >>/release/resolved-dependencies.txt
          destination: release/resolved-dependencies.txt
      - store_artifacts:
          path: build/sdk_update_tests/<< parameters.platform >>/local/resolved-dependencies.txt
          destination: local/resolved-dependencies.txt

  install-android-sdk-on-macos:
    description: Install the Android SDK on macOS
    steps:
      - run:
          name: Install Android SDK commandline tools
          command: brew install --cask android-commandlinetools
      - run:
          name: Set Android SDK environment variables
          command: |
            echo 'export ANDROID_HOME="$HOMEBREW_PREFIX/share/android-commandlinetools"' >> "$BASH_ENV"
            echo 'export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"' >> "$BASH_ENV"
      - android/accept-licenses
      - run:
          name: Install Android SDK platform tools
          command: sdkmanager "platform-tools"

  save-kotlin-native-compiler-to-cache:
    steps:
      - run:
          name: Get the Kotlin version
          command: sed -nE 's/^kotlin = "([^"]+)".*/\1/p' gradle/libs.versions.toml > ~/.kotlin_version
      # We cannot use the Kotlin version in the cache key directly, so we use the checksum of a file
      # containing it instead.
      - save_cache:
          name: Saving Kotlin/Native compiler to cache
          paths: [~/.konan]
          key: konan-{{ arch }}-{{ checksum "~/.kotlin_version" }}

  restore-kotlin-native-compiler-from-cache:
    steps:
      - run:
          name: Get the Kotlin version
          command: sed -nE 's/^kotlin = "([^"]+)".*/\1/p' gradle/libs.versions.toml > ~/.kotlin_version
      # We cannot use the Kotlin version in the cache key directly, so we use the checksum of a file
      # containing it instead.
      - restore_cache:
          name: Restoring Kotlin/Native compiler from cache
          key: konan-{{ arch }}-{{ checksum "~/.kotlin_version" }}

  save-gradle-user-home-directory-to-cache:
    steps:
      - android/save-gradle-cache

  restore-gradle-user-home-directory-from-cache:
    steps:
      - android/restore-gradle-cache:
          find-args: . -name "*.gradle.kts" -o -name "*.versions.toml" -o -name "gradle-wrapper.properties"

  save-incremental-gradle-build-to-workspace:
    steps:
      - persist_to_workspace:
          name: Save incremental Gradle build to workspace
          root: ./
          paths:
            - .gradle
            # This doesn't support directory glob patterns (**), unfortunately.
            - build
            - ./*/build
            - ./*/*/build

  attach-workspace-at-working-directory:
    steps:
      - attach_workspace:
          name: Attach workspace at working directory
          at: ./

  checkout-submodule:
    description: "Checks out a git submodule."
    parameters:
      path:
        type: string
        default: ""
    steps:
      - run:
          name: Check out submodule << parameters.path >>
          command: |
            git submodule init << parameters.path >>
            git submodule update << parameters.path >>

parameters:
  action:
    type: enum
    enum: [ build, bump, update_error_codes ]
    default: build

executors:
  android202409:
    docker:
      - image: cimg/android:2024.09.1
    resource_class: large
  jdk17:
    docker:
      - image: cimg/openjdk:17.0
  ruby3:
    docker:
      - image: cimg/ruby:3.3.0
  # The Xcode version we use to build the static Swift library embedded in our Kotlin Native 
  # artifacts will influence the minimum Xcode version of the consuming app: 
  # https://github.com/RevenueCat/purchases-kmp/issues/859
  # 
  # We should support at least Xcode 26.0, as that is the latest Xcode version supported by
  # Kotlin Native at time of writing:
  # https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html
  # 
  # The CircleCI Xcode image retention policy means that Xcode 16.4.0 is going to be supported
  # longer than Xcode 26.0 is:
  # https://circleci.com/docs/guides/execution-managed/xcode-policy/#xcode-image-retention-and-deprecation
  # 
  # So for that reason we use Xcode 16.4.0 to build our Kotlin Native artifacts (including the 
  # static Swift library) in CI. 
  xcode16:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    environment:
      # Avoid waiting for Homebrew to auto update existing packages, as everything we care about is
      # freshly installed.
      HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  run-sdk-update-test-android:
    executor:
      name: android/android-machine
      resource-class: xlarge
      tag: 2026.05.1
    steps:
      - checkout
      - revenuecat/install-mise-tools:
          tools: java,ruby
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - restore-gradle-user-home-directory-from-cache
      - android/create-avd:
          avd-name: sdk-update-tester
          system-image: system-images;android-32;google_apis;x86_64
          install: true
      - android/start-emulator:
          avd-name: sdk-update-tester
          post-emulator-launch-assemble-command: "true"
      - revenuecat/install-maestro
      - run-sdk-update-test-cases:
          platform: android

  run-sdk-update-test-ios:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - install-android-sdk-on-macos
      - revenuecat/install-mise-tools:
          tools: java,ruby
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - revenuecat/install-maestro
      - run:
          name: Boot SDK update test simulator
          command: |
            device_id=$(xcrun simctl create SDKUpdateTester com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
            xcrun simctl boot "$device_id"
            xcrun simctl bootstatus "$device_id" -b
      - run-sdk-update-test-cases:
          platform: ios
      - store_artifacts:
          path: build/sdk_update_tests/ios/release/xcodebuild.log
          destination: release/xcodebuild.log
      - store_artifacts:
          path: build/sdk_update_tests/ios/local/xcodebuild.log
          destination: local/xcodebuild.log

  prepare-next-snapshot-version:
    description: "Opens a PR updating the SDK version to the next minor, appending -SNAPSHOT."
    executor: ruby3
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - revenuecat/trust-github-key
      - revenuecat/setup-git-credentials
      - run:
          name: Prepare next SNAPSHOT version
          command: bundle exec fastlane prepare_next_snapshot_version

  detekt:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - run:
          name: Run Detekt on commonMain
          command: ./gradlew detektCommonMain
      - save-gradle-user-home-directory-to-cache
      - run:
          name: Collect Detekt HTML reports
          command: mkdir -p artifacts/detekt && mv build/reports/detekt/*.html artifacts/detekt/
      - store_artifacts:
          path: artifacts/detekt
          destination: detekt

  validate-binary-compatibility:
    executor: xcode16
    steps:
      - install-android-sdk-on-macos
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Validate binary compatibility
          command: ./gradlew apiCheck
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache

  build-libraries-android:
    executor: android202409
    steps:
      - checkout
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Build libraries for Android
          command: |
            tasks=()
            for module in core revenuecatui either result; do
              for buildType in Debug Release; do
                tasks+=(":$module:compile${buildType}KotlinAndroid")
              done
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache
      - save-incremental-gradle-build-to-workspace

  build-libraries-ios:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java,ruby
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - attach-workspace-at-working-directory
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - run:
          name: Build libraries for iOS
          command: |
            tasks=()
            for module in core revenuecatui either result; do
              for arch in Arm64 SimulatorArm64 X64; do
                tasks+=(":$module:compileKotlinIos$arch")
              done
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache
      - save-incremental-gradle-build-to-workspace

  # Self-contained on purpose: no workspace persistence or attachment, so it can run in
  # parallel to the iOS chain without workspace conflicts.
  build-and-test-watchos:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - run:
          name: Build libraries and run tests for watchOS
          command: |
            tasks=()
            for module in core result; do
              for arch in Arm64 DeviceArm64 SimulatorArm64; do
                tasks+=(":$module:compileKotlinWatchos$arch")
              done
            done
            # either skips DeviceArm64: arrow-core doesn't publish it.
            for arch in Arm64 SimulatorArm64; do
              tasks+=(":either:compileKotlinWatchos$arch")
            done
            # The commonized (metadata) compilation only runs at publish time otherwise.
            for module in core mappings kn-core models result either; do
              tasks+=(":$module:compileAppleMainKotlinMetadata")
              tasks+=(":$module:watchosSimulatorArm64Test")
            done
            # Links both device slices: compile alone would miss bad Swift-runtime linker
            # opts or missing symbols in the static libs, and no other job links for device.
            tasks+=(":core:linkDebugTestWatchosArm64")
            tasks+=(":core:linkDebugTestWatchosDeviceArm64")
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache

  build-watchos-tester:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - run:
          name: Build the watchOS tester app
          command: |
            xcodebuild \
              -project watchosTester/watchosApp/watchosApp.xcodeproj \
              -scheme watchosApp \
              -configuration Debug \
              -destination 'generic/platform=watchOS Simulator' \
              build
      - save-gradle-user-home-directory-to-cache

  build-sample-android:
    executor: android202409
    steps:
      - checkout
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Build sample app for Android
          command: |
            tasks=()
            for buildType in Debug Release; do
              tasks+=(":composeApp:compile${buildType}KotlinAndroid")
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache

  build-sample-ios:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java,ruby
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - attach-workspace-at-working-directory
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - run:
          name: Build Kotlin code for iOS sample app for every architecture
          command: |
            tasks=()
            for arch in Arm64 SimulatorArm64 X64; do
              tasks+=(":composeApp:compileKotlinIos$arch")
            done
            ./gradlew "${tasks[@]}"
      - run:
          name: Build iOS sample app
          command: |
            xcodebuild \
              -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Debug \
              -sdk iphonesimulator \
              build;
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache

  public-api-tests-android:
    executor: android202409
    steps:
      - checkout
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Test public API for Android
          command: |
            tasks=()
            for buildType in Debug Release; do
              tasks+=(":apiTester:compile${buildType}KotlinAndroid")
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache

  public-api-tests-ios:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java,ruby
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - attach-workspace-at-working-directory
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - run:
          name: Test public API for iOS
          command: |
            tasks=()
            for arch in Arm64 SimulatorArm64 X64; do
              tasks+=(":apiTester:compileKotlinIos$arch")
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache

  unit-tests-android:
    executor: android202409
    steps:
      - checkout
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Execute unit tests for Android
          command: |
            tasks=()
            for buildType in Debug Release; do
              tasks+=("test${buildType}UnitTest")
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache

  unit-tests-ios:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Execute unit tests for iOS
          command: |
            tasks=()
            for arch in SimulatorArm64 X64; do
              tasks+=("ios${arch}Test")
            done
            ./gradlew "${tasks[@]}"
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache

  unit-tests-build-logic:
    executor: xcode16
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java
      - restore-gradle-user-home-directory-from-cache
      - attach-workspace-at-working-directory
      - run:
          name: Execute unit tests for build-logic
          command: ./gradlew :build-logic:convention:test
      - store_test_results:
          path: build-logic/convention/build/test-results
      - save-gradle-user-home-directory-to-cache
      - save-incremental-gradle-build-to-workspace

  publish:
    description: "Publishes the SDK, either a SNAPSHOT or release version."
    executor: xcode16
    parameters:
      snapshot:
        description: Whether to publish a SNAPSHOT version. Will publish a final release if set to false.
        type: boolean
    steps:
      - checkout
      - checkout-submodule
      - revenuecat/install-mise-tools:
          tools: java,ruby
      - install-android-sdk-on-macos
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - restore-gradle-user-home-directory-from-cache
      - restore-kotlin-native-compiler-from-cache
      - when:
          condition: << parameters.snapshot >>
          steps:
            - run:
                name: "Publish snapshot to Sonatype's snapshots repository"
                command: bundle exec fastlane publish_if_snapshot
      - unless:
          condition: << parameters.snapshot >>
          steps:
            - run:
                name: "Publish release to Maven Central"
                command: bundle exec fastlane publish_if_release
      - save-gradle-user-home-directory-to-cache
      - save-kotlin-native-compiler-to-cache

  create-github-release:
    description: "Creates a GitHub release for the current version"
    executor: ruby3
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - revenuecat/trust-github-key
      - run:
          name: "Create a GitHub release for the current version"
          command: bundle exec fastlane github_release_current_version

workflows:
  sdk-update-validation:
    jobs:
      - run-sdk-update-test-android:
          context: maestro
      - run-sdk-update-test-ios:
          context: maestro
